<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><meta name="color-scheme" content="light dark"/><title>Pesquisa de Produtos</title><script>try{document.documentElement.dataset.theme=localStorage.getItem('pesquisa-theme')||'light'}catch(e){}</script></head><body><button id="theme-toggle" type="button" aria-label="Alternar modo escuro">◐</button><div id="root"></div><script>const b=document.getElementById('theme-toggle');const sync=()=>{const d=document.documentElement.dataset.theme==='dark';b.textContent=d?'☀':'◐';b.title=d?'Modo claro':'Modo escuro'};b.onclick=()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';try{localStorage.setItem('pesquisa-theme',document.documentElement.dataset.theme)}catch(e){}sync()};sync()</script><script type="module" src="/src/main.jsx"></script></body></html>
