<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><meta name="color-scheme" content="light dark"/><title>Pesquisa de Produtos</title><script>try{document.documentElement.dataset.theme=localStorage.getItem('pesquisa-theme')||'light'}catch(e){}</script><style>#visual-search{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:9999;padding:18px}#visual-search.open{display:flex}.vs-box{width:min(460px,100%);background:var(--panel,#fff);color:var(--text,#111);border:1px solid rgba(127,127,127,.25);border-radius:14px;padding:20px;box-shadow:0 18px 60px rgba(0,0,0,.25)}.vs-box h3{margin:0 0 5px}.vs-box p{margin:0 0 16px;opacity:.72;font-size:13px}.vs-img{width:72px;height:72px;object-fit:contain;border:1px solid rgba(127,127,127,.2);border-radius:10px;background:#fff;margin-bottom:14px}.vs-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.vs-grid button,.vs-close{border:1px solid rgba(127,127,127,.25);background:transparent;color:inherit;border-radius:9px;padding:11px;cursor:pointer;font-weight:600}.vs-grid button:hover,.vs-close:hover{background:rgba(127,127,127,.1)}.vs-grid .primary{background:#111;color:#fff;border-color:#111}.vs-close{width:100%;margin-top:12px}</style></head><body><button id="theme-toggle" type="button" aria-label="Alternar modo escuro">◐</button><div id="root"></div><div id="visual-search"><div class="vs-box"><img id="vs-img" class="vs-img" alt="Produto"/><h3 id="vs-title">Buscar produto</h3><p>Use a imagem do catálogo para encontrar anúncios semelhantes. O Google Lens pode mostrar produtos, imagens semelhantes e sites onde o item aparece. cite não aplicável no site</p><div class="vs-grid"><button class="primary" data-vs="ml">Mercado Livre</button><button data-vs="sh">Shopee</button><button data-vs="lens">Google Lens</button><button data-vs="name">Busca pelo nome</button></div><button class="vs-close" data-vs="close">Fechar</button></div></div><script>const b=document.getElementById('theme-toggle');const sync=()=>{const d=document.documentElement.dataset.theme==='dark';b.textContent=d?'☀':'◐';b.title=d?'Modo claro':'Modo escuro'};b.onclick=()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';try{localStorage.setItem('pesquisa-theme',document.documentElement.dataset.theme)}catch(e){}sync()};sync();(()=>{const modal=document.getElementById('visual-search'),img=document.getElementById('vs-img'),title=document.getElementById('vs-title');let current={};const open=(p)=>{current=p;img.src=p.image||'';title.textContent='Pesquisar: '+p.name;modal.classList.add('open')};const go=(url)=>window.open(url,'_blank','noopener');const slug=v=>encodeURIComponent(String(v||'').trim());const lens=u=>'https://lens.google.com/uploadbyurl?url='+encodeURIComponent(u);document.addEventListener('click',e=>{const btn=e.target.closest('.card .primary');if(!btn||!btn.textContent.includes('Pesquisar'))return;const card=btn.closest('.card');if(!card)return;const image=card.querySelector('.photo img')?.src||'';const name=card.querySelector('h2')?.textContent?.trim()||'';open({image,name})});modal.addEventListener('click',e=>{const a=e.target.closest('[data-vs]');if(!a)return;const act=a.dataset.vs;if(act==='close'||e.target===modal){modal.classList.remove('open');return}if(!current.name)return;const ml='https://lista.mercadolivre.com.br/'+slug(current.name);const sh='https://shopee.com.br/search?keyword='+slug(current.name);if(act==='ml'){if(current.image)go(lens(current.image));else go(ml)}else if(act==='sh'){if(current.image)go(lens(current.image));else go(sh)}else if(act==='lens'){if(current.image)go(lens(current.image));else go('https://lens.google.com/')}else if(act==='name'){go(ml)}modal.classList.remove('open')});modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.remove('open')})})();</script><script type="module" src="/src/main.jsx"></script></body></html>
